<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product | ALI LUXE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand-logo" href="index.html">
          <img class="brand-icon" src="assets/logo.svg" alt="ALI LUXE logo" />
          <span>ALI LUXE</span>
        </a>
        <button class="menu-toggle" id="menuToggle" aria-label="Open menu">Menu</button>
        <nav class="main-nav">
          <a href="index.html#home">Home</a>
          <a href="shop.html">Shop</a>
          <a href="beauty.html">Beauty</a>
          <a href="fashion.html">Fashion</a>
          <a href="jewelry.html">Jewelry</a>
          <a href="perfumes.html">Perfumes</a>
          <a href="index.html#about">About</a>
          <a href="index.html#contact">Contact</a>
        </nav>
        <div class="nav-actions desktop-only">
          <button class="icon-button">Search</button>
          <button class="icon-button">Wishlist</button>
          <a class="icon-button cart-link" href="checkout.html">Cart <span class="cart-count" id="cartCount">0</span></a>
          <button class="icon-button">Account</button>
        </div>
      </div>
      <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
        <div class="mobile-menu-inner">
          <button class="mobile-close" id="mobileClose" aria-label="Close menu">×</button>
          <nav class="mobile-nav">
            <a href="index.html#home">Home</a>
            <a href="shop.html">Shop</a>
            <a href="beauty.html">Beauty</a>
            <a href="fashion.html">Fashion</a>
            <a href="jewelry.html">Jewelry</a>
            <a href="perfumes.html">Perfumes</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
          </nav>
          <div class="mobile-menu-actions">
            <a href="shop.html" class="button button-primary">Shop Now</a>
            <a href="all-products.html" class="button button-secondary">All Products</a>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="hero-section">
        <div class="container product-detail-grid" id="productDetail">
          <div class="detail-copy">
            <span class="eyebrow">Featured Product</span>
            <h1>Luxury Item</h1>
            <p>Explore luxurious detail and premium craftsmanship.</p>
            <div class="product-price">$0.00</div>
            <button class="button button-primary add-cart" data-product="">Add to Cart</button>
            <div class="product-features">
              <div>Exclusive design</div>
              <div>Curated details</div>
              <div>Rich packaging</div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
